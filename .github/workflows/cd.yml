name: CD

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Preparar incremento de versión
        id: bump
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'version-bump') }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(grep -oE '^AppVersion-[0-9]+' README.md | head -n 1 | cut -d- -f2)
          if [[ -z "$current" ]]; then
            echo "No se encontró AppVersion en README.md"
            exit 1
          fi

          next=$((current + 1))
          timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          sed -i -E "0,/^AppVersion-[0-9]+/s//AppVersion-${next} - ${timestamp}/" README.md
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Crear PR para actualizar versión
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'version-bump') }}
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/version-bump-${{ github.sha }}
          base: main
          add-paths: README.md
          commit-message: "[version-bump] AppVersion-${{ steps.bump.outputs.next }}"
          title: "[version-bump] AppVersion-${{ steps.bump.outputs.next }}"
          body: "Incremento automático de versión con fecha y hora."

  validate-prod:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar PROD_TOKEN
        shell: powershell
        env:
          PROD_SECRET: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:PROD_SECRET -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Los tokens de producción coinciden"
          } else {
            Write-Host "Los tokens de producción NO coinciden"
            exit 1
          }
